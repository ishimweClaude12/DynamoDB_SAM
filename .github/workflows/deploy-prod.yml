# Prod pipeline. Split out of the workflow generated by `sam pipeline init`.
# Deploys ONLY the prod stack, using ONLY the prod bootstrap resources
# (prod pipeline role, prod CloudFormation role, prod artifacts bucket).
# Runs when develop is merged into main.
name: Deploy PROD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  id-token: write   # required for GitHub OIDC -> AWS
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SAM_TEMPLATE: template.yaml
  ENVIRONMENT: prod
  STACK_NAME: dynamodb-lab-prod
  AWS_REGION: eu-north-1
  # Values below come from: sam pipeline bootstrap --stage prod
  # (see .aws-sam/pipeline/pipelineconfig.toml or the stack
  #  aws-sam-cli-managed-prod-pipeline-resources outputs)
  PIPELINE_EXECUTION_ROLE: arn:aws:iam::605134436600:role/aws-sam-cli-managed-prod-pipe-PipelineExecutionRole-pK8dcH2sB64r
  CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::605134436600:role/aws-sam-cli-managed-prod--CloudFormationExecutionRo-n72YDXz38Rlv
  ARTIFACTS_BUCKET: aws-sam-cli-managed-prod-pipeline--artifactsbucket-78dfkwaadc4c

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Assume prod pipeline execution role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-packaging
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Validate template
        run: sam validate --lint --template ${SAM_TEMPLATE} --region ${AWS_REGION}

      - name: Build
        run: sam build --template ${SAM_TEMPLATE}

      - name: Package to prod artifacts bucket
        run: |
          sam package \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --s3-prefix ${STACK_NAME} \
            --region ${AWS_REGION} \
            --output-template-file packaged-prod.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-prod
          path: packaged-prod.yaml

  deploy-prod:
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: actions/download-artifact@v4
        with:
          name: packaged-prod

      - name: Assume prod pipeline execution role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Deploy prod stack
        run: |
          sam deploy \
            --stack-name ${STACK_NAME} \
            --template packaged-prod.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${AWS_REGION} \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --s3-prefix ${STACK_NAME} \
            --role-arn ${CLOUDFORMATION_EXECUTION_ROLE} \
            --parameter-overrides Environment=${ENVIRONMENT} \
            --tags Environment=${ENVIRONMENT} Project=dynamodb-sam-lab \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${STACK_NAME} \
            --query "Stacks[0].Outputs" \
            --output table
