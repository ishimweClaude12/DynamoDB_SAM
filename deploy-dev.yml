# Dev pipeline. Split out of the workflow generated by `sam pipeline init`.
# Deploys ONLY the dev stack, using ONLY the dev bootstrap resources
# (dev pipeline role, dev CloudFormation role, dev artifacts bucket).
name: Deploy DEV

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  id-token: write   # required for GitHub OIDC -> AWS
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  SAM_TEMPLATE: template.yaml
  ENVIRONMENT: dev
  STACK_NAME: dynamodb-lab-dev
  AWS_REGION: eu-north-1
  # Values below come from: sam pipeline bootstrap --stage dev
  # (see .aws-sam/pipeline/pipelineconfig.toml or the stack
  #  aws-sam-cli-managed-dev-pipeline-resources outputs)
  PIPELINE_EXECUTION_ROLE: arn:aws:iam::<ACCOUNT_ID>:role/<DEV_PIPELINE_EXECUTION_ROLE>
  CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::<ACCOUNT_ID>:role/<DEV_CLOUDFORMATION_EXECUTION_ROLE>
  ARTIFACTS_BUCKET: <DEV_ARTIFACTS_BUCKET_NAME>

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Assume dev pipeline execution role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: dev-packaging
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Validate template
        run: sam validate --lint --template ${SAM_TEMPLATE} --region ${AWS_REGION}

      - name: Build
        run: sam build --template ${SAM_TEMPLATE}

      - name: Package to dev artifacts bucket
        run: |
          sam package \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --s3-prefix ${STACK_NAME} \
            --region ${AWS_REGION} \
            --output-template-file packaged-dev.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-dev
          path: packaged-dev.yaml

  deploy-dev:
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: actions/download-artifact@v4
        with:
          name: packaged-dev

      - name: Assume dev pipeline execution role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: dev-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Deploy dev stack
        run: |
          sam deploy \
            --stack-name ${STACK_NAME} \
            --template packaged-dev.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${AWS_REGION} \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --s3-prefix ${STACK_NAME} \
            --role-arn ${CLOUDFORMATION_EXECUTION_ROLE} \
            --parameter-overrides Environment=${ENVIRONMENT} \
            --tags Environment=${ENVIRONMENT} Project=dynamodb-sam-lab \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${STACK_NAME} \
            --query "Stacks[0].Outputs" \
            --output table
